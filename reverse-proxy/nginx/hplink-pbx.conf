# NGINX Configuration for HPLink PBX Cloud
# Place this file in /etc/nginx/sites-available/hplink-pbx
# Create symlink: ln -s /etc/nginx/sites-available/hplink-pbx /etc/nginx/sites-enabled/

# API Server
server {
    listen 80;
    server_name api.hplinkpbx.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hplinkpbx.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.hplinkpbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hplinkpbx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;

    # Proxy to API Server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin Portal
server {
    listen 80;
    server_name admin.hplinkpbx.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.hplinkpbx.com;

    ssl_certificate /etc/letsencrypt/live/admin.hplinkpbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hplinkpbx.com/privkey.pem;

    root /opt/hplink-pbx/portals/admin-portal/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# Client Portal
server {
    listen 80;
    server_name portal.hplinkpbx.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.hplinkpbx.com;

    ssl_certificate /etc/letsencrypt/live/portal.hplinkpbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.hplinkpbx.com/privkey.pem;

    root /opt/hplink-pbx/portals/client-portal/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# WebSocket for SIP.js (WSS)
server {
    listen 443 ssl http2;
    server_name pbx.hplinkpbx.com;

    ssl_certificate /etc/letsencrypt/live/pbx.hplinkpbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbx.hplinkpbx.com/privkey.pem;

    # WebSocket upgrade for SIP.js
    location / {
        proxy_pass http://127.0.0.1:5063;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
